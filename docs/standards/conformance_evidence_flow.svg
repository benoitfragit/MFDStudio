<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">MFDStudio conformance evidence flow</title>
  <desc id="desc">Flow showing specification requirements traced to generator, client helper and runtime tests, and remaining gaps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbfe"/>
      <stop offset="100%" stop-color="#edf4f9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f6985"/>
    </marker>
    <style>
      text { font-family: Segoe UI, Trebuchet MS, Verdana, sans-serif; }
      .box { fill: #ffffff; stroke: #d6e1eb; stroke-width: 2; rx: 22; }
      .box-title { font-size: 23px; font-weight: 700; fill: #10263b; }
      .box-body { font-size: 17px; fill: #4e6272; }
      .gap { fill: #fff3e8; stroke: #f0bf8e; }
      .link { stroke: #0f6985; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .label { font-size: 16px; font-weight: 700; fill: #0a4258; }
      .caption { font-size: 16px; fill: #506577; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <rect class="box" x="40" y="80" width="240" height="180"/>
  <text class="box-title" x="74" y="128">Specification</text>
  <text class="box-body" x="74" y="162">normative rules</text>
  <text class="box-body" x="74" y="188">command semantics</text>
  <text class="box-body" x="74" y="214">profiles and errors</text>

  <rect class="box" x="360" y="50" width="240" height="110"/>
  <text class="box-title" x="394" y="96">Generator Tests</text>
  <text class="box-body" x="394" y="128">shape of generated API</text>

  <rect class="box" x="360" y="190" width="240" height="110"/>
  <text class="box-title" x="394" y="236">Client API Tests</text>
  <text class="box-body" x="394" y="268">generated-style runtime use</text>

  <rect class="box" x="690" y="50" width="240" height="110"/>
  <text class="box-title" x="724" y="96">Runtime Tests</text>
  <text class="box-body" x="724" y="128">transport, mappingHash, scene</text>

  <rect class="gap" x="690" y="190" width="240" height="110"/>
  <text class="box-title" x="724" y="236">Remaining Gaps</text>
  <text class="box-body" x="724" y="268">external feedback client E2E</text>

  <rect class="box" x="1000" y="120" width="160" height="100"/>
  <text class="box-title" x="1030" y="164">Matrix</text>
  <text class="box-body" x="1030" y="194">covered / partial / gap</text>

  <path class="link" d="M280 120 C320 120 325 105 360 105"/>
  <text class="label" x="296" y="106">generated surface</text>

  <path class="link" d="M280 220 C320 220 325 245 360 245"/>
  <text class="label" x="298" y="274">client helper semantics</text>

  <path class="link" d="M600 105 C645 105 648 105 690 105"/>
  <text class="label" x="616" y="92">command execution</text>

  <path class="link" d="M600 245 C645 245 648 245 690 245"/>
  <text class="label" x="616" y="232">coverage not yet closed</text>

  <path class="link" d="M930 105 C966 105 970 148 1000 148"/>
  <path class="link" d="M930 245 C966 245 970 198 1000 198"/>

  <text class="caption" x="40" y="34">Traceability from normative requirement to automated evidence</text>
</svg>
