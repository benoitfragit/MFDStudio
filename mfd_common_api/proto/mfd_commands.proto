syntax = "proto3";

package mfd.transport;

enum PrimitiveLineStyle
{
  PRIMITIVE_LINE_STYLE_UNSPECIFIED = 0;
  PRIMITIVE_LINE_STYLE_SOLID = 1;
  PRIMITIVE_LINE_STYLE_DOTTED = 2;
  PRIMITIVE_LINE_STYLE_DASHED = 3;
}

message Vec2
{
  float x = 1;
  float y = 2;
}

message StaticReticleHandle
{
  uint64 page_id = 1;
  uint64 reticle_id = 2;
}

message DynamicReticleHandle
{
  uint64 page_id = 1;
  uint64 runtime_reticle_id = 2;
}

message PrimitivePatch
{
  optional bool visible = 1;
  optional Vec2 position = 2;
  optional float rotation_degrees = 3;
  optional Vec2 scale = 4;
  optional fixed32 packed_rgba = 5;
  optional fixed32 fill_packed_rgba = 6;
  optional bool filled = 7;
  optional float thickness = 8;
  optional string text = 9;
  optional float letter_spacing = 10;
  optional Vec2 line_start = 11;
  optional Vec2 line_end = 12;
  optional float radius = 13;
  optional float inner_radius = 14;
  optional float outer_radius = 15;
  optional float width = 16;
  optional float height = 17;
  optional Vec2 size = 18;
  repeated Vec2 points = 19;
  optional bool closed = 20;
  optional int32 segments = 21;
  optional float start_angle_degrees = 22;
  optional float end_angle_degrees = 23;
  optional PrimitiveLineStyle line_style = 24;
}

message ReticlePatch
{
  optional bool visible = 1;
  optional Vec2 position = 2;
  optional float rotation_degrees = 3;
  optional fixed32 packed_rgba = 4;
  optional float thickness = 5;
  optional string text = 6;
  map<uint64, string> texts_by_id = 7;
  optional float letter_spacing = 8;
  map<uint64, float> letter_spacings_by_id = 9;
  optional bool blink_enabled = 10;
  optional uint64 blink_type_id = 11;
  map<uint64, PrimitivePatch> primitive_patches_by_id = 12;
}

message ActivatePageCommand
{
  uint64 page_id = 1;
}

message SetPageViewCommand
{
  Vec2 center = 1;
  float zoom = 2;
  uint64 page_id = 3;
}

message WindowDisplayPatch
{
  optional bool invert_colors = 1;
  optional float brightness = 2;
  optional bool disabled = 3;
}

message UpdateWindowDisplayCommand
{
  WindowDisplayPatch patch = 1;
}

message UpdateReticleCommand
{
  StaticReticleHandle target = 1;
  ReticlePatch patch = 2;
}

message UpdateStrobeCommand
{
  optional bool active = 1;
  optional Vec2 position = 2;
  uint64 page_id = 3;
  uint64 strobe_id = 4;
}

message UpsertDynamicReticleCommand
{
  DynamicReticleHandle target = 1;
  ReticlePatch patch = 2;
  uint64 template_transport_id = 3;
}

message DynamicReticleState
{
  uint64 runtime_reticle_id = 1;
  ReticlePatch patch = 2;
}

message UpsertDynamicReticlesCommand
{
  uint64 page_id = 1;
  repeated DynamicReticleState reticles = 2;
  uint64 template_transport_id = 3;
}

message SetDynamicReticleSetVisibilityCommand
{
  bool visible = 1;
  uint64 page_id = 2;
  uint64 template_transport_id = 3;
}

message RemoveDynamicReticleCommand
{
  DynamicReticleHandle target = 1;
}

message ResetWindowCommand
{
}

message UserCommand
{
  oneof command
  {
    ActivatePageCommand activate_page = 1;
    SetPageViewCommand set_page_view = 2;
    UpdateWindowDisplayCommand update_window_display = 3;
    UpdateReticleCommand update_reticle = 4;
    UpdateStrobeCommand update_strobe = 5;
    UpsertDynamicReticleCommand upsert_dynamic_reticle = 6;
    UpsertDynamicReticlesCommand upsert_dynamic_reticles = 7;
    RemoveDynamicReticleCommand remove_dynamic_reticle = 8;
    SetDynamicReticleSetVisibilityCommand set_dynamic_reticle_set_visibility = 9;
    ResetWindowCommand reset_window = 10;
  }
}

message CommandEnvelope
{
  uint32 sequence = 1;
  repeated UserCommand commands = 2;
  string mapping_hash = 3;
}
