name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (example: v1.0.0). Leave empty to use the pushed tag.'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-release-assets:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - configure_preset: vs2022-x64
            build_preset: release-x64
            exec_platform: x64
          - configure_preset: vs2022-win32
            build_preset: release-win32
            exec_platform: win32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: pwsh
        run: |
          if (-not $env:RELEASE_TAG) {
            Write-Error "No release tag resolved."
          }

          if ($env:RELEASE_TAG -notmatch '^v?\d+\.\d+\.\d+([-.].+)?$') {
            Write-Error "Invalid release tag '$env:RELEASE_TAG'. Expected semantic version format like 1.2.3, v1.2.3 or v1.2.3-rc.1"
          }

      - name: Configure (${{ matrix.configure_preset }})
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build (${{ matrix.build_preset }})
        run: cmake --build --preset ${{ matrix.build_preset }}

      - name: Create archive (${{ matrix.exec_platform }})
        id: create_archive
        shell: pwsh
        run: |
          $toolsetDir = Get-ChildItem -Path "_Exec" -Directory | Select-Object -First 1
          if (-not $toolsetDir) {
            Write-Error "No staged runtime found under _Exec"
          }

          $stageDir = Join-Path $toolsetDir.FullName "${{ matrix.exec_platform }}/Release"
          if (-not (Test-Path $stageDir)) {
            Write-Error "Expected stage directory not found: $stageDir"
          }

          $archiveName = "mfd-$env:RELEASE_TAG-${{ matrix.exec_platform }}.zip"
          Compress-Archive -Path "$stageDir/*" -DestinationPath $archiveName
          "archive_name=$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_archive.outputs.archive_name }}
          path: ${{ steps.create_archive.outputs.archive_name }}

  publish-release:
    needs: build-release-assets
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          shopt -s nullglob
          zips=(release_artifacts/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip artifacts found in release_artifacts" >&2
            exit 1
          fi
          sha256sum "${zips[@]}" > release_artifacts/SHA256SUMS.txt

      - name: Build release notes
        id: notes
        env:
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains((github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name), '-') }}
        run: |
          {
            echo "## 📦 Release ${RELEASE_TAG}"
            echo
            if [ "$PRERELEASE" = "true" ]; then
              echo "⚠️ This is a pre-release build."
              echo
            fi
            echo "### Assets"
            echo "- Windows x64 + Win32 ZIP archives"
            echo "- SHA256 checksums in \\`SHA256SUMS.txt\\`"
            echo
            echo "### Quick start"
            echo "1. Download the ZIP for your platform"
            echo "2. Verify checksum with \\`SHA256SUMS.txt\\`"
            echo "3. Extract and run"
          } > release_notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains((github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name), '-') }}
          files: release_artifacts/**/*.zip
            release_artifacts/SHA256SUMS.txt
          body_path: release_notes.md
          generate_release_notes: true
