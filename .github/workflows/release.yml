name: Build and Publish Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v1.0.0). Leave empty to use the current ref when it is already a release tag."
        required: false
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build-release-assets:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configure_preset: vs2022-x64-no-tests
            build_preset: debug-x64-no-tests
            exec_platform: x64
            build_config: Debug
          - configure_preset: vs2022-x64-no-tests
            build_preset: release-x64-no-tests
            exec_platform: x64
            build_config: Release
          - configure_preset: vs2022-win32-no-tests
            build_preset: debug-win32-no-tests
            exec_platform: win32
            build_config: Debug
          - configure_preset: vs2022-win32-no-tests
            build_preset: release-win32-no-tests
            exec_platform: win32
            build_config: Release

    steps:
      - name: Resolve release context
        id: release_context
        shell: pwsh
        env:
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_REF_TYPE: ${{ github.ref_type }}
          CURRENT_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          $tag = $env:CURRENT_REF_NAME
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No release tag resolved."
          }

          if ($tag -notmatch '^v?\d+\.\d+\.\d+([-.].+)?$') {
            throw "Invalid release tag '$tag'. Expected semantic version format like 1.2.3, v1.2.3 or v1.2.3-rc.1."
          }

          $isPrerelease = "false"
          if ($tag.Contains("-") -or $env:INPUT_PRERELEASE -eq "true") {
            $isPrerelease = "true"
          }

          $checkoutRef = "refs/tags/$tag"
          if ($env:CURRENT_REF_TYPE -eq "tag" -and -not [string]::IsNullOrWhiteSpace($env:CURRENT_SHA)) {
            $checkoutRef = $env:CURRENT_SHA
          }

          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checkout_ref=$checkoutRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.release_context.outputs.checkout_ref }}

      - name: Configure (${{ matrix.configure_preset }})
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Stage deliveries (${{ matrix.build_preset }})
        run: cmake --build --preset ${{ matrix.build_preset }} --target stage_deliveries

      - name: Upload staged deliveries artifact
        uses: actions/upload-artifact@v4
        with:
          name: staged-deliveries-${{ matrix.exec_platform }}-${{ matrix.build_config }}
          path: _Deliveries
          if-no-files-found: error

  publish-release:
    needs: build-release-assets
    runs-on: windows-latest

    steps:
      - name: Resolve release context
        id: release_context
        shell: pwsh
        env:
          CURRENT_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          $tag = $env:CURRENT_REF_NAME
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No release tag resolved."
          }

          if ($tag -notmatch '^v?\d+\.\d+\.\d+([-.].+)?$') {
            throw "Invalid release tag '$tag'. Expected semantic version format like 1.2.3, v1.2.3 or v1.2.3-rc.1."
          }

          $isPrerelease = "false"
          if ($tag.Contains("-") -or $env:INPUT_PRERELEASE -eq "true") {
            $isPrerelease = "true"
          }

          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_inputs

      - name: Merge staged delivery trees
        shell: pwsh
        run: |
          function Resolve-DeliveriesRoot {
            param(
              [Parameter(Mandatory = $true)]
              [string]$ArtifactRoot
            )

            $nestedDeliveriesRoot = Join-Path $ArtifactRoot "_Deliveries"
            if (Test-Path $nestedDeliveriesRoot) {
              return $nestedDeliveriesRoot
            }

            $packageFamilyNames = @("packages_windows", "packages_bin_windows")
            $availablePackageFamilies = $packageFamilyNames |
              Where-Object { Test-Path (Join-Path $ArtifactRoot $_) }

            if ($availablePackageFamilies.Count -gt 0) {
              return $ArtifactRoot
            }

            throw (
              "Downloaded artifact '$ArtifactRoot' does not expose a supported deliveries layout. " +
              "Expected either '_Deliveries/<package-family>' or '<package-family>' at the artifact root."
            )
          }

          function Merge-Directory {
            param(
              [Parameter(Mandatory = $true)]
              [string]$SourceDir,
              [Parameter(Mandatory = $true)]
              [string]$DestDir
            )

            New-Item -ItemType Directory -Path $DestDir -Force | Out-Null
            $resolvedSourceDir = (Resolve-Path -LiteralPath $SourceDir).Path

            Get-ChildItem -LiteralPath $resolvedSourceDir -Recurse -Force | ForEach-Object {
              $relativePath = $_.FullName.Substring($resolvedSourceDir.Length).TrimStart('\', '/')
              $destinationPath = Join-Path $DestDir $relativePath

              if ($_.PSIsContainer) {
                New-Item -ItemType Directory -Path $destinationPath -Force | Out-Null
              }
              else {
                $destinationParent = Split-Path -Path $destinationPath -Parent
                if (-not [string]::IsNullOrWhiteSpace($destinationParent)) {
                  New-Item -ItemType Directory -Path $destinationParent -Force | Out-Null
                }

                Copy-Item -LiteralPath $_.FullName -Destination $destinationPath -Force
              }
            }
          }

          $mergedDeliveriesRoot = Join-Path $PWD "_Deliveries"
          New-Item -ItemType Directory -Path $mergedDeliveriesRoot -Force | Out-Null

          $artifactRoots = Get-ChildItem -Path "release_inputs" -Directory
          if ($artifactRoots.Count -eq 0) {
            throw "No staged delivery artifacts were downloaded."
          }

          foreach ($artifactRoot in $artifactRoots) {
            $sourceDeliveriesRoot = Resolve-DeliveriesRoot -ArtifactRoot $artifactRoot.FullName
            $packageFamilyRoots = Get-ChildItem -Path $sourceDeliveriesRoot -Directory |
              Where-Object { $_.Name -in @("packages_windows", "packages_bin_windows") }

            if ($packageFamilyRoots.Count -eq 0) {
              throw "Downloaded artifact '$($artifactRoot.Name)' does not contain any supported package families."
            }

            $packageFamilyRoots | ForEach-Object {
              Merge-Directory -SourceDir $_.FullName -DestDir (Join-Path $mergedDeliveriesRoot $_.Name)
            }
          }

      - name: Create aggregated package archives
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_context.outputs.release_tag }}
        run: |
          $deliveriesRoot = Join-Path $PWD "_Deliveries"
          $archiveDir = Join-Path $PWD "release_artifacts"
          New-Item -ItemType Directory -Path $archiveDir -Force | Out-Null

          $runtimePackagesRoot = Join-Path $deliveriesRoot "packages_bin_windows"
          $runtimeToolsetDir = $null
          if (Test-Path $runtimePackagesRoot) {
            $runtimeToolsetDir = Get-ChildItem -Path $runtimePackagesRoot -Directory |
              ForEach-Object {
                Get-ChildItem -Path (Join-Path $_.FullName "_Exec") -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -ne "_Conf" } |
                  Select-Object -First 1
              } |
              Where-Object { $_ -ne $null } |
              Select-Object -First 1
          }

          $toolset = ""
          if ($runtimeToolsetDir) {
            $toolset = $runtimeToolsetDir.Name
          }

          $createdArchives = New-Object System.Collections.Generic.List[string]

          foreach ($packageRootName in @("packages_windows", "packages_bin_windows")) {
            $packageFamilyRoot = Join-Path $deliveriesRoot $packageRootName
            if (-not (Test-Path $packageFamilyRoot)) {
              continue
            }

            Get-ChildItem -Path $packageFamilyRoot -Directory | Sort-Object Name | ForEach-Object {
              $packageDir = $_
              if ([string]::IsNullOrWhiteSpace($toolset)) {
                $archiveName = "$($packageDir.Name)-$env:RELEASE_TAG.zip"
              }
              else {
                $archiveName = "$($packageDir.Name)-$env:RELEASE_TAG-$toolset.zip"
              }

              Compress-Archive -Path $packageDir.FullName -DestinationPath (Join-Path $archiveDir $archiveName) -Force
              $createdArchives.Add($archiveName)
            }
          }

          if ($createdArchives.Count -eq 0) {
            throw "No aggregated delivery archives were created."
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $zipFiles = Get-ChildItem -Path "release_artifacts" -Filter "*.zip" -File
          if ($zipFiles.Count -eq 0) {
            throw "No zip artifacts found in release_artifacts"
          }

          $checksumLines = foreach ($zipFile in $zipFiles | Sort-Object Name) {
            $hash = (Get-FileHash -Path $zipFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($zipFile.Name)"
          }

          $checksumLines | Set-Content -Path "release_artifacts/SHA256SUMS.txt" -Encoding utf8

      - name: Build release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_context.outputs.release_tag }}
          PRERELEASE: ${{ steps.release_context.outputs.is_prerelease }}
        run: |
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("## Release $env:RELEASE_TAG")
          $lines.Add("")

          if ($env:PRERELEASE -eq "true") {
            $lines.Add('This is a pre-release build.')
            $lines.Add("")
          }

          $lines.Add('### Assets')
          $lines.Add('- One aggregated ZIP per development or install package')
          $lines.Add('- Toolset-qualified asset names such as `MFDStudioClientApi-v1.3.0-v143.zip`')
          $lines.Add('- Each aggregated package contains the staged `v143/win32/Debug`, `v143/win32/Release`, `v143/x64/Debug`, and `v143/x64/Release` trees when that package produces binaries')
          $lines.Add('- Header-only SDK packages remain one archive each, without redundant per-configuration assets')
          $lines.Add('- SHA256 checksums in `SHA256SUMS.txt`')
          $lines.Add("")
          $lines.Add('### Quick start')
          $lines.Add('1. Download the package matching your use case')
          $lines.Add('2. Verify the checksum with `SHA256SUMS.txt`')
          $lines.Add('3. Extract the package and use the staged `_Exec` or `build/native` tree matching your platform and configuration')

          $lines | Set-Content -Path "release_notes.md" -Encoding utf8

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_context.outputs.release_tag }}
          prerelease: ${{ steps.release_context.outputs.is_prerelease }}
          files: |
            release_artifacts/**/*.zip
            release_artifacts/SHA256SUMS.txt
          body_path: release_notes.md
          generate_release_notes: true
