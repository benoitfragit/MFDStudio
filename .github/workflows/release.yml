name: Build and Publish Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v1.0.0). Leave empty to use the current ref when it is already a release tag."
        required: false
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build-release-assets:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configure_preset: vs2022-x64-no-tests
            build_preset: debug-x64-no-tests
            exec_platform: x64
            build_config: Debug
          - configure_preset: vs2022-x64-no-tests
            build_preset: release-x64-no-tests
            exec_platform: x64
            build_config: Release
          - configure_preset: vs2022-win32-no-tests
            build_preset: debug-win32-no-tests
            exec_platform: win32
            build_config: Debug
          - configure_preset: vs2022-win32-no-tests
            build_preset: release-win32-no-tests
            exec_platform: win32
            build_config: Release

    steps:
      - name: Resolve release context
        id: release_context
        shell: pwsh
        env:
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_REF_TYPE: ${{ github.ref_type }}
          CURRENT_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          $tag = $env:CURRENT_REF_NAME
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No release tag resolved."
          }

          if ($tag -notmatch '^v?\d+\.\d+\.\d+([-.].+)?$') {
            throw "Invalid release tag '$tag'. Expected semantic version format like 1.2.3, v1.2.3 or v1.2.3-rc.1."
          }

          $isPrerelease = "false"
          if ($tag.Contains("-") -or $env:INPUT_PRERELEASE -eq "true") {
            $isPrerelease = "true"
          }

          $checkoutRef = "refs/tags/$tag"
          if ($env:CURRENT_REF_TYPE -eq "tag" -and -not [string]::IsNullOrWhiteSpace($env:CURRENT_SHA)) {
            $checkoutRef = $env:CURRENT_SHA
          }

          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checkout_ref=$checkoutRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.release_context.outputs.checkout_ref }}

      - name: Configure (${{ matrix.configure_preset }})
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Stage deliveries (${{ matrix.build_preset }})
        run: cmake --build --preset ${{ matrix.build_preset }} --target stage_deliveries

      - name: Create package archives (${{ matrix.exec_platform }} ${{ matrix.build_config }})
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_context.outputs.release_tag }}
        run: |
          $archiveDir = Join-Path $PWD "release_archives"
          New-Item -ItemType Directory -Path $archiveDir -Force | Out-Null

          $runtimeToolsetDir = Get-ChildItem -Path "_Deliveries/packages_bin_windows" -Directory |
            ForEach-Object {
              Get-ChildItem -Path (Join-Path $_.FullName "_Exec") -Directory -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -ne "_Conf" } |
                Select-Object -First 1
            } |
            Where-Object { $_ -ne $null } |
            Select-Object -First 1

          if (-not $runtimeToolsetDir) {
            throw "No staged runtime package found under _Deliveries/packages_bin_windows"
          }

          $toolset = $runtimeToolsetDir.Name
          $createdArchives = New-Object System.Collections.Generic.List[string]

          $devPackagesRoot = Join-Path $PWD "_Deliveries/packages_windows"
          if (Test-Path $devPackagesRoot) {
            Get-ChildItem -Path $devPackagesRoot -Directory | ForEach-Object {
              $packageDir = $_
              $packageName = $packageDir.Name
              $toolsetLibRoot = Join-Path $packageDir.FullName "build/native/libs/$toolset"
              $platformConfigDir = Join-Path $packageDir.FullName "build/native/libs/$toolset/${{ matrix.exec_platform }}/${{ matrix.build_config }}"

              if (Test-Path $platformConfigDir) {
                $archiveName = "$packageName-$env:RELEASE_TAG-$toolset-${{ matrix.exec_platform }}-${{ matrix.build_config }}.zip"
                Compress-Archive -Path $packageDir.FullName -DestinationPath (Join-Path $archiveDir $archiveName) -Force
                $createdArchives.Add($archiveName)
              }
              elseif (-not (Test-Path $toolsetLibRoot) -and "${{ matrix.exec_platform }}" -eq "x64" -and "${{ matrix.build_config }}" -eq "Release") {
                $archiveName = "$packageName-$env:RELEASE_TAG-$toolset.zip"
                Compress-Archive -Path $packageDir.FullName -DestinationPath (Join-Path $archiveDir $archiveName) -Force
                $createdArchives.Add($archiveName)
              }
            }
          }

          $runtimePackagesRoot = Join-Path $PWD "_Deliveries/packages_bin_windows"
          if (Test-Path $runtimePackagesRoot) {
            Get-ChildItem -Path $runtimePackagesRoot -Directory | ForEach-Object {
              $packageDir = $_
              $packageName = $packageDir.Name
              $platformConfigDir = Join-Path $packageDir.FullName "_Exec/$toolset/${{ matrix.exec_platform }}/${{ matrix.build_config }}"

              if (Test-Path $platformConfigDir) {
                $archiveName = "$packageName-$env:RELEASE_TAG-$toolset-${{ matrix.exec_platform }}-${{ matrix.build_config }}.zip"
                Compress-Archive -Path $packageDir.FullName -DestinationPath (Join-Path $archiveDir $archiveName) -Force
                $createdArchives.Add($archiveName)
              }
            }
          }

          if ($createdArchives.Count -eq 0) {
            throw "No delivery archives were created."
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ matrix.exec_platform }}-${{ matrix.build_config }}
          path: release_archives/*.zip

  publish-release:
    needs: build-release-assets
    runs-on: windows-latest

    steps:
      - name: Resolve release context
        id: release_context
        shell: pwsh
        env:
          CURRENT_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          $tag = $env:CURRENT_REF_NAME
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No release tag resolved."
          }

          if ($tag -notmatch '^v?\d+\.\d+\.\d+([-.].+)?$') {
            throw "Invalid release tag '$tag'. Expected semantic version format like 1.2.3, v1.2.3 or v1.2.3-rc.1."
          }

          $isPrerelease = "false"
          if ($tag.Contains("-") -or $env:INPUT_PRERELEASE -eq "true") {
            $isPrerelease = "true"
          }

          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Generate checksums
        shell: pwsh
        run: |
          $zipFiles = Get-ChildItem -Path "release_artifacts" -Filter "*.zip" -File
          if ($zipFiles.Count -eq 0) {
            throw "No zip artifacts found in release_artifacts"
          }

          $checksumLines = foreach ($zipFile in $zipFiles | Sort-Object Name) {
            $hash = (Get-FileHash -Path $zipFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($zipFile.Name)"
          }

          $checksumLines | Set-Content -Path "release_artifacts/SHA256SUMS.txt" -Encoding utf8

      - name: Build release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_context.outputs.release_tag }}
          PRERELEASE: ${{ steps.release_context.outputs.is_prerelease }}
        run: |
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("## Release $env:RELEASE_TAG")
          $lines.Add("")

          if ($env:PRERELEASE -eq "true") {
            $lines.Add('This is a pre-release build.')
            $lines.Add("")
          }

          $lines.Add('### Assets')
          $lines.Add('- Development and install ZIP packages')
          $lines.Add('- Toolset-qualified asset names such as `MFDStudioClientApi-v1.3.0-v143-win32-Debug.zip`')
          $lines.Add('- Win32/x64 Debug/Release variants for every package carrying platform-specific binaries')
          $lines.Add('- One toolset-qualified archive only for header-only SDK packages such as `MFDStudioEditorPlugin-v1.3.0-v143.zip`')
          $lines.Add('- SHA256 checksums in `SHA256SUMS.txt`')
          $lines.Add("")
          $lines.Add('### Quick start')
          $lines.Add('1. Download the package matching your use case, platform, and configuration')
          $lines.Add('2. Verify the checksum with `SHA256SUMS.txt`')
          $lines.Add('3. Extract the package and use the staged `_Exec` or `build/native` tree')

          $lines | Set-Content -Path "release_notes.md" -Encoding utf8

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_context.outputs.release_tag }}
          prerelease: ${{ steps.release_context.outputs.is_prerelease }}
          files: |
            release_artifacts/**/*.zip
            release_artifacts/SHA256SUMS.txt
          body_path: release_notes.md
          generate_release_notes: true
