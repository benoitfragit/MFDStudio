name: Build and Publish Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (example: v1.0.0). Leave empty to use the current ref when it is already a release tag."
        required: false
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  publish-release:
    runs-on: windows-2022

    steps:
      - name: Resolve release context
        id: release_context
        shell: pwsh
        env:
          CURRENT_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          $tag = $env:CURRENT_REF_NAME
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $tag = $env:INPUT_TAG
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No release tag resolved."
          }

          if ($tag -notmatch '^v?\d+\.\d+\.\d+([-.].+)?$') {
            throw "Invalid release tag '$tag'. Expected semantic version format like 1.2.3, v1.2.3 or v1.2.3-rc.1."
          }

          $isPrerelease = "false"
          if ($tag.Contains("-") -or $env:INPUT_PRERELEASE -eq "true") {
            $isPrerelease = "true"
          }

          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "is_prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Align checkout to requested release tag
        if: ${{ github.event_name == 'workflow_dispatch' && steps.release_context.outputs.release_tag != github.ref_name }}
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_context.outputs.release_tag }}
        run: |
          if (git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG") {
            git checkout "refs/tags/$env:RELEASE_TAG"
          }
          else {
            Write-Host "Tag '$env:RELEASE_TAG' does not exist yet; keeping the current checkout."
          }

      - name: Validate release build matrix
        id: validation
        shell: pwsh
        run: |
          $summaryMarkdownPath = Join-Path $env:RUNNER_TEMP "release-validation-summary.md"
          $summaryJsonPath = Join-Path $env:RUNNER_TEMP "release-validation-summary.json"

          pwsh -File .github/scripts/Invoke-ReleaseValidation.ps1 `
            -SummaryMarkdownPath $summaryMarkdownPath `
            -SummaryJsonPath $summaryJsonPath

          "summary_markdown=$summaryMarkdownPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "summary_json=$summaryJsonPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Get-Content $summaryMarkdownPath | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Doxygen, Graphviz, and PlantUML
        id: docs_tools
        shell: pwsh
        run: |
          choco install doxygen.install graphviz -y --no-progress
          $plantUmlDirectory = Join-Path $env:RUNNER_TEMP "plantuml"
          New-Item -ItemType Directory -Force $plantUmlDirectory | Out-Null
          $plantUmlJar = Join-Path $plantUmlDirectory "plantuml.jar"
          Invoke-WebRequest -Uri "https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar" -OutFile $plantUmlJar

          $candidatePaths = @(
            "${env:ProgramFiles}\doxygen\bin",
            "${env:ProgramFiles}\Graphviz\bin"
          )

          foreach ($candidatePath in $candidatePaths) {
            if (Test-Path $candidatePath) {
              $candidatePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

          "plantuml_jar=$plantUmlJar" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install mdBook
        shell: pwsh
        run: |
          $mdBookVersion = "v0.4.40"
          $mdBookDirectory = Join-Path $env:RUNNER_TEMP "mdbook"
          New-Item -ItemType Directory -Force $mdBookDirectory | Out-Null
          $archive = Join-Path $mdBookDirectory "mdbook.zip"
          $downloadUri = "https://github.com/rust-lang/mdBook/releases/download/$mdBookVersion/mdbook-$mdBookVersion-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $downloadUri -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $mdBookDirectory -Force
          $mdBookDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build combined documentation site
        shell: pwsh
        run: |
          pwsh -File docs/BuildDocsSite.ps1 `
            -Version "${{ steps.release_context.outputs.release_tag }}" `
            -PlantUmlJarPath "${{ steps.docs_tools.outputs.plantuml_jar }}"

      - name: Package documentation site
        id: docs_package
        shell: pwsh
        run: |
          $siteDirectory = "build/docs/site"
          if (-not (Test-Path (Join-Path $siteDirectory "index.html"))) {
            throw "Documentation site was not built at $siteDirectory."
          }

          $archiveName = "MFDStudio-docs-${{ steps.release_context.outputs.release_tag }}.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          if (Test-Path $archivePath) {
            Remove-Item -Force $archivePath
          }

          Compress-Archive -Path (Join-Path $siteDirectory "*") -DestinationPath $archivePath -Force
          "docs_archive=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Compose release preamble
        id: release_body
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_context.outputs.release_tag }}
          DOCS_ARCHIVE: ${{ steps.docs_package.outputs.docs_archive }}
          VALIDATION_SUMMARY_PATH: ${{ steps.validation.outputs.summary_markdown }}
          VALIDATION_JSON_PATH: ${{ steps.validation.outputs.summary_json }}
        run: |
          $validationSummary = (Get-Content $env:VALIDATION_SUMMARY_PATH -Raw).TrimEnd()
          $validationMetadata = Get-Content $env:VALIDATION_JSON_PATH -Raw | ConvertFrom-Json
          $docsUrl = "https://benoitfragit.github.io/MFDStudio"
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $docsArchiveName = Split-Path -Leaf $env:DOCS_ARCHIVE
          $releaseBodyPath = Join-Path $env:RUNNER_TEMP "release-body.md"

          $bodyLines = @(
            "## Release health",
            "",
            "[![Release pipeline](https://img.shields.io/badge/release-published-2ea043?style=for-the-badge)]($runUrl)",
            "[![Validation](https://img.shields.io/badge/validation-passed-2ea043?style=for-the-badge)]($runUrl)",
            "[![Repository state](https://img.shields.io/badge/repository-validated-0969da?style=for-the-badge)]($runUrl)",
            "[![Docs](https://img.shields.io/badge/docs-online-8250df?style=for-the-badge)]($docsUrl)",
            "",
            ('- Release tag: `{0}`' -f $env:RELEASE_TAG),
            "- Workflow run: [#${env:GITHUB_RUN_NUMBER}]($runUrl)",
            "- Online documentation: [$docsUrl]($docsUrl)",
            ('- Documentation archive: `{0}`' -f $docsArchiveName),
            "- Validation scope: $($validationMetadata.BuildCount) build targets, $($validationMetadata.TestSuiteCount) automated test suites, $($validationMetadata.TestCaseCount) discovered test cases",
            "",
            $validationSummary,
            "",
            "---",
            ""
          )

          $bodyLines | Set-Content -Path $releaseBodyPath -Encoding utf8
          "release_body=$releaseBodyPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_context.outputs.release_tag }}
          prerelease: ${{ steps.release_context.outputs.is_prerelease }}
          body_path: ${{ steps.release_body.outputs.release_body }}
          generate_release_notes: true
          files: ${{ steps.docs_package.outputs.docs_archive }}
