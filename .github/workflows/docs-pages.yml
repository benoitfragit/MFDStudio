name: Publish API Docs

on:
  workflow_run:
    workflows: ["Build and Publish Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish (tag, branch, or SHA). Leave empty to use the current ref."
        required: false
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-docs:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Resolve docs ref
        id: docs_context
        shell: pwsh
        env:
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          $docsRef = $env:CURRENT_REF
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_REF)) {
            $docsRef = $env:INPUT_REF
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WORKFLOW_RUN_HEAD_SHA)) {
            $docsRef = $env:WORKFLOW_RUN_HEAD_SHA
          }

          if ([string]::IsNullOrWhiteSpace($docsRef)) {
            throw "No documentation ref resolved."
          }

          "docs_ref=$docsRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.docs_context.outputs.docs_ref }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Doxygen, Graphviz, and PlantUML
        id: docs_tools
        shell: pwsh
        run: |
          choco install doxygen.install graphviz -y --no-progress
          $plantUmlDirectory = Join-Path $env:RUNNER_TEMP "plantuml"
          New-Item -ItemType Directory -Force $plantUmlDirectory | Out-Null
          $plantUmlJar = Join-Path $plantUmlDirectory "plantuml.jar"
          Invoke-WebRequest -Uri "https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar" -OutFile $plantUmlJar

          $candidatePaths = @(
            "${env:ProgramFiles}\doxygen\bin",
            "${env:ProgramFiles}\Graphviz\bin"
          )

          foreach ($candidatePath in $candidatePaths) {
            if (Test-Path $candidatePath) {
              $candidatePath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

          "plantuml_jar=$plantUmlJar" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install mdBook
        shell: pwsh
        run: |
          $mdBookVersion = "v0.4.40"
          $mdBookDirectory = Join-Path $env:RUNNER_TEMP "mdbook"
          New-Item -ItemType Directory -Force $mdBookDirectory | Out-Null
          $archive = Join-Path $mdBookDirectory "mdbook.zip"
          $downloadUri = "https://github.com/rust-lang/mdBook/releases/download/$mdBookVersion/mdbook-$mdBookVersion-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $downloadUri -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $mdBookDirectory -Force
          $mdBookDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Resolve published version label
        id: version
        shell: pwsh
        run: |
          $tag = (git tag --points-at HEAD | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = (git rev-parse --short HEAD).Trim()
          }

          "docs_version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build combined documentation site
        shell: pwsh
        run: |
          pwsh -File docs/BuildDocsSite.ps1 `
            -Version "${{ steps.version.outputs.docs_version }}" `
            -PlantUmlJarPath "${{ steps.docs_tools.outputs.plantuml_jar }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/site

  deploy-docs:
    needs: build-docs
    runs-on: windows-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
